<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QPT AI BD</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}.h{padding:15px;text-align:center;background:#111}.logo{color:#a855f7;font-size:24px;font-weight:800}.owner{color:#22c55e;font-size:13px}#c{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.m{padding:10px 14px;border-radius:18px;max-width:80%}.a{background:#1e1e2a;align-self:flex-start}.u{background:#a855f7;align-self:flex-end}.b{padding:10px;background:#111;display:flex;gap:8px}.b input{flex:1;padding:12px;border-radius:30px;border:0;outline:0;background:#1e1e2a;color:#fff}.b button{width:44px;height:44px;border-radius:50%;border:0;background:#a855f7;color:#fff}</style></head><body><div class="h"><div class="logo">QPT AI BD 🇧🇩</div><div class="owner">👑 মালিক: ইফাত ভাই</div></div><div id="c"><div class="m a">আসসালামু আলাইকুম! আমি QPT AI BD, আমার মালিক ইফাত ভাই। বলো কি লাগবে?</div></div><div class="b"><input id="q" placeholder="লিখো..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">➤</button></div><script>const ch=document.getElementById('c'),inp=document.getElementById('q');function add(t,cl){let d=document.createElement('div');d.className='m '+cl;d.innerText=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight;return d}async function go(){let t=inp.value.trim();if(!t)return;add(t,'u');inp.value='';let l=t.toLowerCase();if(l.includes('মালিক')||l.includes('malik')||l.includes('owner')){add('আমার মালিক ইফাত ভাই 👑','a');return}let a=add('টাইপ করছি...','a');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t));a.innerText=await r.text()}catch(e){a.innerText='নেট স্লো, আবার বলো ভাই'}} </script></body></html>
