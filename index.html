<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QPT AI BD</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}.h{padding:15px;text-align:center;background:#111}.logo{color:#a855f7;font-size:24px;font-weight:800}.owner{color:#22c55e;font-size:13px}#c{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px;max-width:700px;width:100%;margin:0 auto}.m{padding:12px 16px;border-radius:18px;max-width:85%}.a{align-self:flex-start;background:#1e1e2a;border:1px solid #333}.u{align-self:flex-end;background:#a855f7}.b{padding:12px;background:#111}.box{max-width:700px;margin:0 auto;display:flex;gap:8px;background:#1e1e2a;padding:10px 14px;border-radius:30px}.box input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.box button{width:44px;height:44px;border-radius:50%;border:0;background:#a855f7;color:#fff}</style></head><body><div class="h"><div class="logo">QPT AI BD 🇧🇩</div><div class="owner">👑 মালিক: ইফাত ভাই</div></div><div id="c"><div class="m a">আসসালামু আলাইকুম! আমি QPT AI BD, আমার মালিক ইফাত ভাই। বলো কি লাগবে? 😊</div></div><div class="b"><div class="box"><input id="q" placeholder="প্রশ্ন লিখো..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">➤</button></div></div><script>const ch=document.getElementById('c'),inp=document.getElementById('q');function add(t,cl){let d=document.createElement('div');d.className='m '+cl;d.innerText=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight;return d}async function go(){let t=inp.value.trim();if(!t)return;add(t,'u');inp.value='';let l=t.toLowerCase();if(l.includes('মালিক')||l.includes('malik')||l.includes('owner')||l.includes('বানাই')){add('আমার মালিক ইফাত ভাই 👑','a');return}let a=add('টাইপ করছি...','a');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t));a.innerText=await r.text()}catch(e){a.innerText='নেট স্লো, আবার বলো!'}} </script></body></html>
