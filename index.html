<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QPT AI BD - Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:'Hind Siliguri',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{padding:20px;text-align:center;border-bottom:1px solid #222}
.logo{font-size:32px;font-weight:700;color:#a855f7;letter-spacing:2px;text-shadow:0 0 20px #a855f780}
.chat-container{flex:1;max-width:800px;width:100%;margin:0 auto;padding:20px;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding-bottom:20px;display:flex;flex-direction:column;gap:15px;min-height:400px}
.msg{max-width:85%;padding:14px 18px;border-radius:18px;line-height:1.5;font-size:15px}
.user{align-self:flex-end;background:#a855f7;color:white;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#1a1a24;border:1px solid #2a2a3a;border-bottom-left-radius:4px}
.input-area{display:flex;gap:10px;background:#1a1a24;padding:12px;border-radius:30px;border:1px solid #2a2a3a;margin-top:10px}
.input-area input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px}
.input-area button{background:#a855f7;border:0;width:45px;height:45px;border-radius:50%;color:#fff;font-size:20px}
.sug{background:#1a1a24;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:13px;color:#aaa;display:inline-block;margin:5px;cursor:pointer}
.footer{text-align:center;padding:15px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="header"><div class="logo">QPT AI BD</div><div style="color:#888;font-size:14px">বাংলাদেশের স্মার্ট AI সহকারী</div></div>
<div class="chat-container">
<div><span class="sug" onclick="ask(this)">গল্প বলো</span><span class="sug" onclick="ask(this)">ফ্রিল্যান্সিং টিপস</span><span class="sug" onclick="ask(this)">কোডিং হেল্প</span></div>
<div class="messages" id="msgs"><div class="msg ai">আসসালামু আলাইকুম! আমি <b style="color:#a855f7">QPT AI BD</b> 😊 কি হেল্প করবো?</div></div>
<div class="input-area"><input id="inp" placeholder="এখানে লিখো..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
<div class="footer">© 2026 QPT AI BD | Made in BD</div>
<script>
const msgs=document.getElementById('msgs');const inp=document.getElementById('inp');
const replies=["দারুণ প্রশ্ন! এটা নিয়ে তোমাকে হেল্প করছি...","বাহ! QPT AI BD সবসময় তোমার পাশে আছে।","এই টপিক নিয়ে YouTube ভিডিও বানালে ভাইরাল হবে!","তুমি প্রতিদিন 1 ঘন্টা সময় দিলে 30 দিনে এক্সপার্ট হয়ে যাবে!"];
function addMsg(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function send(){let t=inp.value.trim();if(!t)return;addMsg(t,'user');inp.value='';setTimeout(()=>{addMsg(replies[Math.floor(Math.random()*replies.length)],'ai')},600);}
function ask(el){inp.value=el.innerText;send();}
</script>
</body>
</html>
