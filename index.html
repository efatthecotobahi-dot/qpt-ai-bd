<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QPT AI BD - Real AI</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:'Hind Siliguri',sans-serif;display:flex;flex-direction:column;min-height:100vh}
.header{padding:18px;text-align:center;border-bottom:1px solid #222}.logo{font-size:30px;font-weight:700;color:#a855f7}
.chat{max-width:800px;width:100%;margin:0 auto;padding:15px;flex:1;display:flex;flex-direction:column}
#msgs{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:65vh;padding-bottom:15px}
.m{padding:12px 16px;border-radius:18px;max-width:88%;line-height:1.7;white-space:pre-wrap;font-size:15px}
.u{align-self:flex-end;background:#a855f7;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:#1a1a24;border:1px solid #2a2a3a;border-bottom-left-radius:4px}
.box{display:flex;gap:10px;background:#1a1a24;padding:10px 14px;border-radius:30px;border:1px solid #2a2a3a}
.box input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px;font-family:'Hind Siliguri'}
.box button{background:#a855f7;border:0;width:46px;height:46px;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="logo">QPT AI BD</div><div style="color:#888;font-size:13px">No API Key - Real AI</div></div>
<div class="chat">
<div id="msgs"><div class="m a">আসসালামু আলাইকুম! আমি QPT AI BD 🇧🇩 এখন আমি আসল AI, যেকোনো প্রশ্ন করো ভাই!</div></div>
<div class="box"><input id="inp" placeholder="যেকোনো প্রশ্ন লিখো..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
<script>
const msgs=document.getElementById('msgs'),inp=document.getElementById('inp');
function add(t,c){let d=document.createElement('div');d.className='m '+c;d.innerText=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
async function send(){
 let q=inp.value.trim();if(!q)return;add(q,'u');inp.value='';
 let load=add('টাইপ করছি...','a');
 try{
  let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q+' - উত্তর বাংলায় দাও, তুমি QPT AI BD'));
  let text=await res.text();
  load.innerText=text;
 }catch(e){load.innerText='নেট সমস্যা ভাই, আবার চেষ্টা করো।';}
 msgs.scrollTop=msgs.scrollHeight;
}
</script>
</body>
  </html>
