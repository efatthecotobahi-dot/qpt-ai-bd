<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QPT AI BD</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}.h{padding:12px;text-align:center;background:#111;border-bottom:1px solid #222}.logo{color:#a855f7;font-size:22px;font-weight:800}.owner{color:#22c55e;font-size:13px}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}.msg{padding:10px 14px;border-radius:18px;max-width:85%;font-size:15px}.ai{align-self:flex-start;background:#1e1e2a;border:1px solid #333}.user{align-self:flex-end;background:#a855f7}.inp-area{padding:10px;background:#111;border-top:1px solid #222}.box{max-width:600px;margin:0 auto;display:flex;gap:8px;background:#1e1e2a;padding:8px 12px;border-radius:30px}.box input{flex:1;background:0;border:0;outline:0;color:#fff;font-size:16px}.box button{background:#a855f7;border:0;width:40px;height:40px;border-radius:50%;color:#fff}</style></head><body><div class="h"><div class="logo">QPT AI BD 🇧🇩</div><div class="owner">👑 মালিক: ইফাত ভাই</div></div><div id="chat"><div class="msg ai">আসসালামু আলাইকুম ভাই! আমি QPT AI BD, আমার মালিক ইফাত ভাই। বলো কি জানতে চাও?</div></div><div class="inp-area"><div class="box"><input id="q" placeholder="প্রশ্ন লিখো..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div></div><script>const c=document.getElementById('chat'),i=document.getElementById('q');function add(t,cl){let d=document.createElement('div');d.className='msg '+cl;d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d}async function send(){let t=i.value.trim();if(!t)return;add(t,'user');i.value='';let l=t.toLowerCase();if(l.includes('মালিক')||l.includes('malik')||l.includes('owner')||l.includes('বানাই')){add('আমার মালিক হলো ইফাত ভাই 👑 (EfatTheCotoBahi)! উনিই আমাকে বানিয়েছেন!','ai');return}let a=add('টাইপ করছি...','ai');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t));let d=await r.text();a.innerText=d}catch(e){a.innerText='নেট স্লো ভাই, আবার বলো!'}} </script></body></html>
